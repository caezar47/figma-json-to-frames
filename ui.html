<!DOCTYPE html>
<html>
<body>
<p style="margin: 0 0 12px; font-size: 12px;">
  <a href="https://github.com/caezar47/figma-json-to-frames" target="_blank" rel="noopener noreferrer">Памятка / документация</a>
</p>

<h3 style="margin: 0 0 8px; font-size: 13px;">Настройки</h3>
<p style="margin: 0 0 4px; font-size: 12px; color: #333;">Имя шаблона на странице</p>
<input id="templateName" type="text" placeholder="TEMPLATE" value="TEMPLATE" style="width: 100%; padding: 6px; margin-bottom: 12px; box-sizing: border-box;" />

<p style="margin: 0 0 4px; font-size: 12px; color: #333;">Поле JSON для имени клона</p>
<input id="nameField" type="text" placeholder="sku" value="sku" style="width: 100%; padding: 6px; margin-bottom: 16px; box-sizing: border-box;" />

<h3 style="margin: 0 0 8px; font-size: 13px;">JSON</h3>
<textarea id="json" style="width:100%; height:200px; box-sizing: border-box;"></textarea>

<br /><br />
<button id="generate">Сгенерировать</button>

<script>
    function postProjectPreview() {
        const project = 'dewalt';
        const templateName = document.getElementById('templateName').value.trim() || 'TEMPLATE';
        parent.postMessage(
            { pluginMessage: { type: 'preview-project', project, templateName } },
            '*'
        );
    }

    document.getElementById('templateName').onchange = postProjectPreview;

    document.getElementById('generate').onclick = () => {
        const data = JSON.parse(document.getElementById('json').value);
        const project = 'dewalt';
        const nameField = document.getElementById('nameField').value.trim();
        const templateName = document.getElementById('templateName').value.trim() || 'TEMPLATE';

        parent.postMessage(
            { pluginMessage: { type: 'generate', data, project, nameField, templateName } },
            '*'
        );
    };

    postProjectPreview();
</script>
</body>
</html>
